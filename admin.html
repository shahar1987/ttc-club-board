<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://apis.google.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.googleapis.com; frame-src https://ttcmh-2a752.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#ffffff">
<title>ניהול · מועדון טניס שולחן מבואות החרמון</title>
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:"Rubik";font-weight:400;font-display:swap;src:url(fonts/rubik-hebrew-400-normal.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Rubik";font-weight:400;font-display:swap;src:url(fonts/rubik-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Rubik";font-weight:600;font-display:swap;src:url(fonts/rubik-hebrew-600-normal.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Rubik";font-weight:600;font-display:swap;src:url(fonts/rubik-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:"Secular One";font-weight:400;font-display:swap;src:url(fonts/secular-one-hebrew-400-normal.woff2) format("woff2");unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
:root{--green:#3e5706;--bright:#56761a;--tint:#f1f5e6;--ink:#1d2622;--muted:#5f6763;--line:#e8e9e6;--sunk:#f3f4f2;--warn:#b5574f;
  --display:"Secular One","Rubik",system-ui,sans-serif;--ease:cubic-bezier(.2,.8,.2,1);--tabh:64px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:8px}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{width:40px;height:40px}
.top h1{flex:1;margin:0;font-family:var(--display);font-weight:400;font-size:21px;color:var(--green)}
.back{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px;color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.screen{animation:rise .35s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.btn{min-height:46px;border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:600;padding:0 18px;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:#fff;color:var(--warn);border:1px solid #efd6d3}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-weight:600;font-size:14px}
.form input[type=text],.form input[type=url],.form input[type=date],.form textarea,.form select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:10px 12px;font-size:16px;font-weight:400}
.form textarea{min-height:110px;resize:vertical}
.chk{display:flex!important;grid-template-columns:none;align-items:center;gap:10px;font-weight:500!important}
.chk input{width:22px;height:22px;accent-color:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-size:14px;min-height:1px}
.ok{color:var(--bright);font-size:14px}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.item img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:var(--sunk)}
.item h3{margin:0 0 2px;font-size:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--green)}
.tag.off{background:var(--sunk);color:var(--muted)}
.tag.bad{background:#f8e9e7;color:var(--warn)}
.list .card{padding:12px 14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--tint);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--green)}
.stat small{color:var(--muted)}
.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:0 12px;font-size:16px;margin-bottom:12px}
.tabbar{position:fixed;inset:auto 0 0 0;z-index:6;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tab{border:0;background:none;display:grid;place-items:center;align-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.tab .ic{font-size:20px;line-height:1}
.tab[aria-selected=true]{color:var(--green)}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;gap:14px;align-content:center}
.center img{width:120px}
.gbtn{min-height:52px;display:inline-flex;align-items:center;gap:10px;border-radius:16px;padding:10px 22px;background:#fff;border:1px solid #dadce0;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);z-index:9;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;transition:transform .3s var(--ease),opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}
.preview{max-width:100%;max-height:220px;border-radius:14px;display:block}
.links a{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="in"><img src="logo.png" alt=""><h1>ניהול המועדון</h1><a class="back" href="./">לפורטל ←</a></div></header>
<main id="main"><div class="center"><img src="logo.png" alt=""><div class="muted">טוען…</div></div></main>
<nav class="tabbar" id="tabbar" role="tablist" hidden></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="admin.js"></script>
</body>
</html>
